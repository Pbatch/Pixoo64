[project]
name = "pixoo64"
version = "0.0.1"
requires-python = "==3.14.*"

dependencies = [
    "urllib3==2.7.0",
    "pillow==12.2.0",
    "boto3==1.43.33",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"